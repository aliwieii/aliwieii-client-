name: Build NEXORA CLIENT (Forge 1.8.9)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package Forge 1.8.9 JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Build NEXORA Client JAR
        working-directory: ./forge-1.8.9
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify Output JAR Exists
        working-directory: ./forge-1.8.9
        run: |
          ls -lh build/libs/
          test -f build/libs/NEXORA-CLIENT-1.0.0-1.8.9.jar

      - name: Upload NEXORA-CLIENT-1.0.0-1.8.9.jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-CLIENT-1.0.0-1.8.9
          path: forge-1.8.9/build/libs/NEXORA-CLIENT-1.0.0-1.8.9.jar
          if-no-files-found: error
          retention-days: 30
